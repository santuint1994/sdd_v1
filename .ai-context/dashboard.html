<!DOCTYPE html>
<html lang="en" data-theme-pref="system">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>SDD Control Center — sdd_v1</title>
<script>
  (function () {
    try {
      var p = localStorage.getItem('sdd.theme') || 'system';
      var dark = p === 'dark' || (p === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    } catch (e) { /* storage unavailable: CSS defaults apply */ }
  })();
</script>
<!--
  SDD Control Center — single-file dashboard (HTML + CSS + vanilla JS, no dependencies).

  SYNC POINTS (keep in step with status.md / pr_reviews / prompt_history.md):
    1. <template id="tpl-records"> — the Gate 0 / Gate 1 / Gate 2 / Active Specs tables.
       This is the authoritative review record and is machine-read by the PR-gate workflows.
       Edit the <tbody> rows in place exactly as before.
    2. const DATA (in the <script> at the end) — structured snapshot that drives every KPI,
       lifecycle stage and search result. Update gate0 counts, comments[], requirements[],
       openQuestions[], specs[] and tests[]; all metrics are derived, never typed.
-->
<style>
/* ───────── Design tokens ───────── */
:root {
  --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Consolas, "Liberation Mono", monospace;
  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px;
  --sidebar-w: 248px; --sidebar-w-collapsed: 64px; --header-h: 56px;
  --ease: cubic-bezier(.2,.7,.2,1);

  --background: #f5f6f8;
  --surface: #ffffff;
  --surface-secondary: #f0f2f5;
  --surface-hover: #eaedf2;
  --border: #e1e5eb;
  --border-strong: #cdd3dc;
  --text-primary: #12151c;
  --text-secondary: #4f5766;
  --text-tertiary: #646c7c;
  --primary: #3552d6;
  --primary-soft: #e8ecff;
  --primary-contrast: #ffffff;
  --success: #0d7a4d;  --success-soft: #e2f4ec;
  --warning: #8a5600;  --warning-soft: #fcf0d6;
  --danger:  #b3262d;  --danger-soft:  #fde9e9;
  --info:    #1a62a6;  --info-soft:    #e2eff9;
  --neutral: #4f5766;  --neutral-soft: #eceff3;
  --shadow-sm: 0 1px 2px rgba(16,24,40,.05);
  --shadow-md: 0 8px 24px rgba(16,24,40,.10), 0 2px 6px rgba(16,24,40,.06);
  --overlay: rgba(12,16,24,.42);
  --skeleton-a: #eceff3; --skeleton-b: #f6f8fa;
}
:root[data-theme="dark"] {
  --background: #0c0e13;
  --surface: #14171f;
  --surface-secondary: #1a1e28;
  --surface-hover: #212634;
  --border: #272c39;
  --border-strong: #363d4e;
  --text-primary: #e8eaf0;
  --text-secondary: #a6adbc;
  --text-tertiary: #8b93a4;
  --primary: #8aa0ff;
  --primary-soft: rgba(138,160,255,.14);
  --primary-contrast: #0c0e13;
  --success: #4ccb8f;  --success-soft: rgba(76,203,143,.13);
  --warning: #e9b554;  --warning-soft: rgba(233,181,84,.13);
  --danger:  #f58489;  --danger-soft:  rgba(245,132,137,.13);
  --info:    #62b3f2;  --info-soft:    rgba(98,179,242,.13);
  --neutral: #a6adbc;  --neutral-soft: rgba(166,173,188,.12);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
  --shadow-md: 0 12px 32px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.4);
  --overlay: rgba(0,0,0,.6);
  --skeleton-a: #1a1e28; --skeleton-b: #222836;
}

/* ───────── Base ───────── */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font: 400 14px/1.5 var(--font-sans); color: var(--text-primary); background: var(--background); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4, p { margin: 0; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: var(--primary); }
code { font-family: var(--font-mono); font-size: .92em; }
code { background: var(--surface-secondary); padding: 1px 5px; border-radius: 4px; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip-link { position: absolute; left: 8px; top: -60px; z-index: 100; background: var(--primary); color: var(--primary-contrast); padding: 8px 12px; border-radius: var(--radius-sm); }
.skip-link:focus { top: 8px; }
.icon { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icon.lg { width: 20px; height: 20px; }
.muted { color: var(--text-secondary); }
.faint { color: var(--text-tertiary); }
.nowrap { white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }

/* ───────── App shell ───────── */
.app { display: grid; grid-template-columns: var(--sidebar-w) minmax(0,1fr); min-height: 100vh; transition: grid-template-columns .18s var(--ease); }
.app.collapsed { grid-template-columns: var(--sidebar-w-collapsed) minmax(0,1fr); }
.sidebar { position: sticky; top: 0; height: 100vh; overflow-y: auto; overflow-x: hidden; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 40; }
.brand { display: flex; align-items: center; gap: 10px; height: var(--header-h); padding: 0 16px; border-bottom: 1px solid var(--border); flex: none; }
.brand-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--primary); color: var(--primary-contrast); display: grid; place-items: center; flex: none; }
.brand-text { font-weight: 650; letter-spacing: -.01em; white-space: nowrap; }
.brand-text small { display: block; font-weight: 400; font-size: 11px; color: var(--text-tertiary); letter-spacing: 0; }
.nav { padding: 10px 10px 16px; flex: 1; }
.nav-group + .nav-group { margin-top: 14px; }
.nav-label { padding: 6px 10px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-tertiary); white-space: nowrap; }
.nav-link { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 34px; padding: 6px 10px; border-radius: var(--radius-sm); color: var(--text-secondary); text-decoration: none; font-weight: 500; white-space: nowrap; position: relative; }
.nav-link:hover { background: var(--surface-secondary); color: var(--text-primary); }
.nav-link[aria-current="page"] { background: var(--primary-soft); color: var(--primary); }
.nav-link .count { margin-left: auto; font-size: 11px; font-weight: 600; min-width: 20px; text-align: center; padding: 1px 6px; border-radius: 999px; background: var(--surface-secondary); color: var(--text-secondary); }
.nav-link .count.alert { background: var(--danger-soft); color: var(--danger); }
.nav-link .count.warn { background: var(--warning-soft); color: var(--warning); }
@media (min-width: 901px) {
.collapsed .nav-label, .collapsed .brand-text, .collapsed .nav-link .txt { display: none; }
.collapsed .nav-link { justify-content: center; padding: 6px; }
.collapsed .nav-link .count { position: absolute; top: 1px; right: 2px; min-width: 16px; font-size: 10px; padding: 0 4px; margin: 0; }
.collapsed .brand { justify-content: center; padding: 0; }
.collapsed .nav-group + .nav-group { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
}
.sidebar-foot { padding: 12px 16px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-tertiary); }
@media (min-width: 901px) { .collapsed .sidebar-foot { display: none; } }

.main-col { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 30; height: var(--header-h); display: flex; align-items: center; gap: 8px; padding: 0 20px; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: saturate(1.4) blur(8px); border-bottom: 1px solid var(--border); }
.topbar .spacer { flex: 1; }
.icon-btn { width: 34px; height: 34px; display: grid; place-items: center; border-radius: var(--radius-sm); color: var(--text-secondary); position: relative; }
.icon-btn:hover, .icon-btn[aria-expanded="true"] { background: var(--surface-secondary); color: var(--text-primary); }
.pill-btn { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); font-weight: 500; }
.pill-btn:hover, .pill-btn[aria-expanded="true"] { background: var(--surface-secondary); }
.env-tag { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--info-soft); color: var(--info); }
.search-btn { display: flex; align-items: center; gap: 8px; width: min(420px, 100%); height: 34px; padding: 0 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-secondary); color: var(--text-tertiary); text-align: left; }
.search-btn:hover { border-color: var(--border-strong); }
.search-btn .grow { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
kbd { font: 600 11px var(--font-mono); padding: 1px 6px; border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 5px; background: var(--surface); color: var(--text-secondary); }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; }

.menu-wrap { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); min-width: 230px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-md); padding: 6px; z-index: 60; }
.menu.left { left: 0; right: auto; }
.menu-title { padding: 8px 10px 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-tertiary); }
.menu-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: var(--radius-sm); text-align: left; }
.menu-item:hover, .menu-item:focus-visible { background: var(--surface-secondary); }
.menu-item[aria-checked="true"], .menu-item[aria-current="true"] { color: var(--primary); font-weight: 600; }
.menu-item .tick { margin-left: auto; opacity: 0; }
.menu-item[aria-checked="true"] .tick, .menu-item[aria-current="true"] .tick { opacity: 1; }
.menu-sep { height: 1px; background: var(--border); margin: 6px 0; }

/* ───────── Page ───────── */
.page { padding: 24px; max-width: 1560px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-head h1 { font-size: 22px; letter-spacing: -.02em; }
.crumbs { font-size: 12px; color: var(--text-tertiary); margin-bottom: 2px; }
.grid { display: grid; gap: 16px; }
.grid.two-one { grid-template-columns: minmax(0,1.7fr) minmax(0,1fr); }
.grid.two { grid-template-columns: repeat(2, minmax(0,1fr)); }
.grid.one-two { grid-template-columns: minmax(0,1fr) minmax(0,1.6fr); }
@media (max-width: 1100px) { .grid.two-one, .grid.two, .grid.one-two { grid-template-columns: minmax(0,1fr); } }
@media (max-width: 760px) { .page { padding: 16px; } }

/* ───────── Panels ───────── */
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); min-width: 0; display: flex; flex-direction: column; }
.panel.emph { border-color: var(--border-strong); box-shadow: var(--shadow-md); }
.panel-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px 10px; }
.panel-head h2 { font-size: 14px; font-weight: 650; letter-spacing: -.005em; }
.panel.emph .panel-head h2 { font-size: 15px; }
.panel-head .sub { font-size: 12px; color: var(--text-tertiary); }
.panel-head .tools { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.panel-body { padding: 4px 16px 16px; min-width: 0; flex: 1; }
.panel-body.flush { padding: 0 0 4px; }
.panel-foot { padding: 10px 16px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--text-secondary); }
.link-btn { color: var(--primary); font-weight: 550; font-size: 13px; display: inline-flex; align-items: center; gap: 4px; }
.link-btn:hover { text-decoration: underline; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--surface); font-weight: 550; font-size: 13px; }
.btn:hover { background: var(--surface-secondary); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-contrast); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12px; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { height: 26px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-size: 12px; font-weight: 550; color: var(--text-secondary); display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { background: var(--surface-secondary); }
.chip[aria-pressed="true"], .chip[aria-checked="true"] { background: var(--primary-soft); border-color: transparent; color: var(--primary); }
.chip .n { font-variant-numeric: tabular-nums; opacity: .8; }
input.field { height: 30px; padding: 0 8px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface); color: var(--text-primary); font: inherit; font-size: 13px; }
input.field { min-width: 0; width: 180px; }

/* ───────── Badges ───────── */
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px 2px 6px; border-radius: 999px; font-size: 11.5px; font-weight: 600; line-height: 1.5; white-space: nowrap; background: var(--neutral-soft); color: var(--neutral); }
.badge .icon { width: 12px; height: 12px; stroke-width: 2.2; }
.badge.success, .badge.ok { background: var(--success-soft); color: var(--success); }
.badge.warning, .badge.warn { background: var(--warning-soft); color: var(--warning); }
.badge.danger, .badge.bad { background: var(--danger-soft); color: var(--danger); }
.badge.info { background: var(--info-soft); color: var(--info); }
.badge.primary { background: var(--primary-soft); color: var(--primary); }
.badge.neutral { background: var(--neutral-soft); color: var(--neutral); }

/* ───────── Info tooltip ───────── */
.info-tip { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; color: var(--text-tertiary); vertical-align: middle; }
.info-tip:hover { color: var(--text-primary); background: var(--surface-secondary); }
.info-tip .icon { width: 14px; height: 14px; }
.tooltip { position: fixed; z-index: 120; max-width: 280px; padding: 8px 10px; border-radius: var(--radius-sm); background: var(--text-primary); color: var(--surface); font-size: 12px; line-height: 1.45; box-shadow: var(--shadow-md); pointer-events: none; }

/* ───────── Hero ───────── */
.hero { padding: 20px 22px; display: grid; gap: 18px; }
.hero-top { display: flex; justify-content: space-between; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
.hero h1 { font-size: 24px; letter-spacing: -.025em; line-height: 1.2; }
.hero-status { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; color: var(--text-secondary); }
.hero-progress { min-width: 220px; text-align: right; }
.hero-progress .big { font-size: 30px; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
.meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px 20px; padding-top: 16px; border-top: 1px solid var(--border); }
.meta-item dt { font-size: 11.5px; color: var(--text-tertiary); font-weight: 550; }
.meta-item dd { margin: 2px 0 0; font-weight: 600; }
.meta-item dd small { display: block; font-weight: 400; color: var(--text-secondary); font-size: 12px; }
.verdict { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: var(--radius-md); background: var(--danger-soft); color: var(--text-primary); font-size: 13px; }
.verdict.ok { background: var(--success-soft); }
.verdict .icon { margin-top: 2px; color: var(--danger); }
.verdict.ok .icon { color: var(--success); }

/* ───────── Progress ───────── */
.bar { height: 6px; background: var(--surface-secondary); border-radius: 999px; overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: inherit; background: var(--primary); transition: width .4s var(--ease); }
.bar.success > span { background: var(--success); } .bar.warning > span { background: var(--warning); } .bar.danger > span { background: var(--danger); } .bar.info > span { background: var(--info); }
.bar.lg { height: 8px; }

/* ───────── KPI cards ───────── */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); gap: 12px; }
.kpi { text-align: left; padding: 14px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 6px; min-width: 0; transition: border-color .15s, transform .15s; }
.kpi { position: relative; }
.kpi.linked:hover { border-color: var(--border-strong); transform: translateY(-1px); }
.kpi-hit { font-weight: 600; color: inherit; text-align: left; }
.kpi-hit::after { content: ""; position: absolute; inset: 0; border-radius: var(--radius-md); }
.kpi-hit:focus-visible { outline: none; }
.kpi-hit:focus-visible::after { outline: 2px solid var(--primary); outline-offset: 2px; }
.kpi .info-tip { position: relative; z-index: 2; }
.kpi-label { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--text-secondary); }
.kpi-value { font-size: 28px; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; }
.kpi-value small { font-size: 14px; font-weight: 550; color: var(--text-tertiary); letter-spacing: 0; }
.kpi-desc { font-size: 12px; color: var(--text-secondary); min-height: 18px; }
.kpi-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; }
.trend { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
.trend.up { color: var(--success); } .trend.down { color: var(--danger); }

/* ───────── Lifecycle ───────── */
.stepper { list-style: none; margin: 0; padding: 4px 16px 16px; display: grid; grid-template-columns: repeat(8, minmax(0,1fr)); gap: 0; }
.step { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 0 4px; }
.step::before { content: ""; position: absolute; top: 17px; left: -50%; width: 100%; height: 2px; background: var(--border-strong); z-index: 0; }
.step:first-child::before { display: none; }
.step.done::before, .step.active::before { background: var(--success); }
.step-btn { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; padding: 2px 2px 6px; border-radius: var(--radius-md); z-index: 1; }
.step-btn:hover { background: var(--surface-secondary); }
.node { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 2px solid var(--border-strong); color: var(--text-tertiary); }
.step.done .node { background: var(--success); border-color: var(--success); color: var(--surface); }
.step.active .node { border-color: var(--primary); color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); background: var(--surface); }
.step.blocked .node { border-style: dashed; border-color: var(--danger); color: var(--danger); }
.step.failed .node { background: var(--danger); border-color: var(--danger); color: var(--surface); }
.step-title { font-size: 12.5px; font-weight: 600; line-height: 1.25; }
.step-state { font-size: 11px; font-weight: 600; color: var(--text-tertiary); }
.step.active .step-state { color: var(--primary); } .step.done .step-state { color: var(--success); } .step.blocked .step-state, .step.failed .step-state { color: var(--danger); }
@media (max-width: 980px) {
  .stepper { grid-template-columns: minmax(0,1fr); gap: 2px; }
  .step::before { display: none; }
  .step-btn { flex-direction: row; text-align: left; gap: 12px; padding: 8px; }
  .step-text { display: flex; flex-direction: column; }
}
@media (min-width: 981px) { .step-text { display: contents; } }

/* ───────── Lists / rows ───────── */
.list { list-style: none; margin: 0; padding: 0; }
.row { display: flex; align-items: flex-start; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--border); width: 100%; text-align: left; }
.list > li:first-child > .row, .list > .row:first-child { border-top: 0; }
button.row:hover { background: var(--surface-secondary); }
.row .grow { flex: 1; min-width: 0; }
.id { font-family: var(--font-mono); font-size: 12px; font-weight: 600; color: var(--text-secondary); white-space: nowrap; }

/* ───────── Tables ───────── */
.table-wrap { overflow-x: auto; max-width: 100%; }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th, table.data td { text-align: left; padding: 8px 12px; border-top: 1px solid var(--border); vertical-align: middle; }
table.data thead th { border-top: 0; border-bottom: 1px solid var(--border); font-size: 11.5px; font-weight: 600; color: var(--text-tertiary); background: var(--surface-secondary); white-space: nowrap; position: sticky; top: 0; }
table.data tbody tr:first-child td { border-top: 0; }
table.data tbody tr.clickable { cursor: pointer; }
table.data tbody tr.clickable:hover { background: var(--surface-secondary); }
table.data td.r, table.data th.r { text-align: right; }

/* ───────── Stats ───────── */
.stat-split { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; }
.stat { padding: 10px 12px; border-radius: var(--radius-md); background: var(--surface-secondary); }
.stat b { display: block; font-size: 20px; letter-spacing: -.02em; }

/* ════════════════════════════════════════════════════════════════════
   3. Derived intelligence (nothing below is hard-coded)
   ════════════════════════════════════════════════════════════════════ */
function derive() {
  const g0 = DATA.gate0;
  const cm = g0.comments;
  const byStatus = s => cm.filter(c => c.status === s).length;
  const addressed = byStatus('addressed'), partial = byStatus('partial'), openC = byStatus('open');
  const outstanding = cm.length - addressed;
  const awaitingConfirm = addressed;        // every addressed response awaits reviewer confirmation (per review record)
  const g0ok = g0.status === 'approved';

  const reqs = DATA.requirements;
  const has = (r, k) => r.trace[k].length > 0;
  const cov = k => reqs.filter(r => has(r, k)).length;
  const noSpec = reqs.filter(r => !has(r, 'spec'));
  const noTest = reqs.filter(r => !has(r, 'test'));

  const oq = { open: 0, deferred: 0, resolved: 0 };
  DATA.openQuestions.forEach(q => { oq[q.status]++; });

  const tests = DATA.tests;
  const tCount = s => tests.filter(t => t.status === s).length;

  // Lifecycle status derived from gate / artefact state
  const specs = DATA.specs;
  const specsApproved = specs.filter(s => s.gate1 === 'approved').length;
  const stageStatus = {
    requirements: 'completed',
    gate0: g0ok ? 'completed' : g0.status === 'rejected' ? 'failed' : 'active',
    spec: !g0ok ? 'blocked' : specs.length ? (specs.every(s => s.status === 'approved' || s.status === 'inreview') ? 'completed' : 'active') : 'pending',
    gate1: !g0ok ? 'blocked' : !specs.length ? 'pending' : specsApproved === specs.length ? 'completed' : 'active',
    plan: specsApproved ? 'active' : 'pending',
    impl: cov('impl') === reqs.length ? 'completed' : cov('impl') ? 'active' : 'pending',
    gate2: 'pending',
    release: 'pending'
  };
  const stageOrder = ['requirements','gate0','spec','gate1','plan','impl','gate2','release'];
  const doneStages = stageOrder.filter(s => stageStatus[s] === 'completed').length;
  const activeFraction = stageStatus.gate0 === 'active' ? addressed / cm.length : 0;
  const progress = Math.round(((doneStages + activeFraction) / stageOrder.length) * 100);
  const currentStage = stageOrder.find(s => stageStatus[s] === 'active') || stageOrder.find(s => stageStatus[s] !== 'completed');

  const specCoverage = pct(reqs.filter(r => has(r, 'spec')).length, reqs.length);
  const testCoverage = pct(reqs.filter(r => has(r, 'test')).length, reqs.length);
  const implCoverage = pct(cov('impl'), reqs.length);

  const health = !g0ok ? { k: 'danger', l: 'Blocked', i: 'lock' }
    : outstanding ? { k: 'warning', l: 'At risk', i: 'alert' } : { k: 'success', l: 'On track', i: 'check' };

  return { addressed, partial, openC, outstanding, awaitingConfirm, g0ok, total: cm.length, reqs, cov, noSpec, noTest, oq,
    tCount, tests, specs, stageStatus, stageOrder, progress, currentStage,
    specCoverage, testCoverage, implCoverage, health,
    reqTotal: reqs.length, brdCount: reqs.filter(r => r.type === 'BRD').length, nfrCount: reqs.filter(r => r.type === 'NFR').length,
    newCount: reqs.filter(r => r.isNew).length };
}

  $('#theme-icon').innerHTML = `<use href="#i-${icon}"/>`;
  $$('[data-theme-set]').forEach(b => b.setAttribute('aria-checked', String(b.dataset.themeSet === pref)));
}

let firstPaint = true;
function renderPanel(el, withSkeleton) {
  const id = el.dataset.panel, p = PANELS[id], full = el.dataset.full === '1';
  const slot = $('[data-slot]', el);
  const fk = document.activeElement && el.contains(document.activeElement) ? (document.activeElement.closest('[data-fk]') || {}).dataset : null;
  const caret = fk && document.activeElement.selectionStart != null ? document.activeElement.selectionStart : null;
  const run = () => {
    try {
      const out = p.render({ full });
      if (out && out.node) { slot.replaceChildren(out.node); } else slot.innerHTML = out;
      const sub = $('[data-sub]', el); if (sub && p.sub) sub.textContent = p.sub();
    } catch (err) {
      console.error(`[dashboard] panel "${id}" failed:`, err);
      slot.innerHTML = stateError(p.err || 'Unable to load this section.', id);
    }
    if (fk && fk.fk) {
      const t = el.querySelector(`[data-fk="${CSS.escape(fk.fk)}"]`);
      if (t) { t.focus({ preventScroll: true }); if (caret != null && t.setSelectionRange) { try { t.setSelectionRange(caret, caret); } catch { /* not a text input */ } } }
    }
  };
  if (withSkeleton) { slot.innerHTML = skeleton(); setTimeout(run, 180); } else run();
}
function renderAllPanels(withSkeleton) { $$('section[data-panel]', $('#view')).forEach(el => renderPanel(el, withSkeleton)); }

let current = 'dashboard';
function renderRoute(id, { skeleton: sk = false, focus = true } = {}) {

const SCOPE_OF = { req: 'req', spec: 'spec', test: 'test', oq: 'oq', comment: 'review', gate: 'review', page: 'all', action: 'all' };

function buildIndex() {
  const ix = [];
  DATA.requirements.forEach(r => ix.push({ type: 'req', id: r.id, title: r.title, status: r.trace.spec.length ? 'active' : (D.g0ok ? 'nospec' : 'blocked'), statusLabel: r.trace.spec.length ? 'Specified' : D.g0ok ? 'No spec' : 'Spec blocked', hay: `${r.id} ${r.title} ${r.area}` }));
  DATA.specs.forEach(s => ix.push({ type: 'spec', id: s.id, title: s.title, status: s.status, hay: `${s.id} ${s.title}` }));
  DATA.tests.forEach(t => ix.push({ type: 'test', id: t.id, title: t.title, status: t.status === 'notrun' ? 'pending' : t.status, hay: `${t.id} ${t.title} ${t.req || ''}` }));

  DATA.gate0.comments.forEach(c => ix.push({ type: 'comment', id: String(c.n), label: `Comment ${c.n}`, title: c.title, status: c.status, hay: `comment ${c.n} ${c.title} gate 0 review` }));

}
const hl = (text, terms) => {

};

    items.push({ type: 'action', id: 'theme', title: 'Toggle light / dark theme', group: 'Quick actions' }, { type: 'action', id: 'collapse', title: 'Collapse or expand the sidebar', group: 'Quick actions' });

document.addEventListener('click', e => {
  const t = e.target;
  const app = $('#app');
  if (app.classList.contains('nav-open') && !t.closest('#sidebar') && !t.closest('[data-action="nav-toggle"]')) app.classList.remove('nav-open');
  if (t.closest('.nav-link')) app.classList.remove('nav-open');
  const th = t.closest('[data-theme-set]');
  if (th) { setTheme(th.dataset.themeSet); closeMenus(); return; }
  const m = t.closest('[data-menu]');
  if (m) { toggleMenu(m.dataset.menu); return; }
  if (!t.closest('.menu-wrap')) closeMenus();
  const tp = t.closest('.info-tip');
  if (tp) { showTip(tp); return; }
  hideTip();
  const a = t.closest('[data-action]'); if (!a) return;
  const act = a.dataset.action;
  switch (act) {
    case 'nav-toggle': app.classList.toggle('nav-open'); break;
    case 'sidebar-collapse': toggleSidebar(); break;
    case 'search-open': openPalette(); break;
    case 'help': openDrawer('help', 'help'); break;
    case 'open': openTarget(a.dataset.type, a.dataset.id); break;
    case 'target': closeMenus(); openTarget(a.dataset.type, a.dataset.id); break;
    case 'route': closeMenus(); location.hash = `#/${a.dataset.route}`; closeDrawer(); break;
    case 'drawer-close': closeDrawer(); break;
    case 'drawer-back': ui.drawer.pop(); { const top = ui.drawer.pop(); if (top) openDrawer(top.type, top.id); else closeDrawer(); } break;
    case 'palette-close': closePalette(); break;
    case 'palette-scope': ui.palette.scope = a.dataset.val; ui.palette.idx = 0; renderPalette(); $('.palette-input input').focus(); break;
    case 'palette-open': activateResult(Number(a.dataset.i)); break;
    case 'retry': rerender(a.dataset.panel); break;
    case 'filter': {
      const pid = a.dataset.panel; const key = a.dataset.key, val = a.dataset.val;
      if (pid === 'drawer-gate0') { ps(pid, {})[key] = val; refreshDrawer(); break; }
      ps(pid, {})[key] = val; rerender(pid); break; }
    default: break;
  }
});
let inputTimer;
document.addEventListener('input', e => {
  const a = e.target.closest('[data-action="filter-input"]');
  if (a) { clearTimeout(inputTimer); inputTimer = setTimeout(() => { const pid = a.dataset.panel; ps(pid, {})[a.dataset.key] = a.value; rerender(pid); }, 120); return; }
  if (e.target.matches('.palette-input input')) { ui.palette.q = e.target.value; ui.palette.idx = 0; renderPalette(); }
});
document.addEventListener('mouseover', e => { const tp = e.target.closest('.info-tip'); if (tp && ttFor !== tp) showTip(tp); });
document.addEventListener('mouseout', e => { const tp = e.target.closest('.info-tip'); if (tp && !tp.contains(e.relatedTarget)) hideTip(); });
document.addEventListener('focusin', e => { const tp = e.target.closest('.info-tip'); if (tp) showTip(tp); else if (ttFor) hideTip(); });
window.addEventListener('scroll', hideTip, { passive: true });

function trapFocus(e, container) {
  const f = $$('button:not([disabled]), [href], input, select, textarea, [tabindex]:not([tabindex="-1"])', container).filter(x => x.offsetParent !== null);
  if (!f.length) return; const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}
document.addEventListener('keydown', e => {
  const pal = $('.palette'), drw = $('.drawer');
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) || document.activeElement.isContentEditable;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); pal ? closePalette() : openPalette(); return; }
  if (e.key === '/' && !typing && !pal) { e.preventDefault(); openPalette(); return; }
  if (e.key === 'Escape') {
    if (pal) { closePalette(); return; }
    if (drw) { closeDrawer(); return; }
    if ($$('[data-menu][aria-expanded="true"]').length) { const b = $('[data-menu][aria-expanded="true"]'); closeMenus(); b.focus(); return; }
    if (ttFor) { hideTip(); return; }
    $('#app').classList.remove('nav-open'); return;
  }
  if (pal) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); const n = paletteResults.length; if (!n) return;
      ui.palette.idx = (ui.palette.idx + (e.key === 'ArrowDown' ? 1 : -1) + n) % n;
      $$('.result', pal).forEach((r, i) => r.setAttribute('aria-selected', String(i === ui.palette.idx)));
      const sel = $(`#res-${ui.palette.idx}`); if (sel) { sel.scrollIntoView({ block: 'nearest' }); $('.palette-input input').setAttribute('aria-activedescendant', sel.id); }
    } else if (e.key === 'Enter' && document.activeElement.matches('.palette-input input')) { e.preventDefault(); activateResult(ui.palette.idx); }
    else if (e.key === 'Tab') trapFocus(e, pal);
  } else if (drw && e.key === 'Tab') trapFocus(e, drw);
  const open = $('[data-menu][aria-expanded="true"]');
  if (open && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    const items = $$('button, [role="menuitem"]', $('#menu-' + open.dataset.menu)).filter(x => x.tagName === 'BUTTON');
    if (items.length) { e.preventDefault(); const i = items.indexOf(document.activeElement); items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus(); }
  }
});

/* ════════════════════════════════════════════════════════════════════
   13. Boot
   ════════════════════════════════════════════════════════════════════ */
function boot() {
  applyTheme(themePref());
  if (store.get('sdd.sidebar', 'expanded') === 'collapsed') { $('#app').classList.add('collapsed'); const b = $('#collapse-btn'); b.setAttribute('aria-pressed', 'true'); b.setAttribute('aria-label', 'Expand sidebar'); }
  $('#env-tag').textContent = DATA.project.env;
  $('#avatar').textContent = initials(currentUser().name);
  window.addEventListener('hashchange', route);
  route();
}
boot();
})();
</script>
